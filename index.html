
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyroscope Data</title>
</head>

<body>

    <h1>Phone Gyroscope</h1>

    <p>Alpha: <span id="alpha">0</span></p>
    <p>Beta: <span id="beta">0</span></p>
    <p>Gamma: <span id="gamma">0</span></p>

    <button id="start">Start sensor</button>

    <script>
        // Get the HTML elements where the sensor values will be displayed
        const alphaElement = document.getElementById("alpha");
        const betaElement = document.getElementById("beta");
        const gammaElement = document.getElementById("gamma");

        const startButton = document.getElementById("start");

        // Start reading the gyroscope when the button is pressed
        startButton.addEventListener("click", async () => {

            // Some phones require permission before accessing motion sensors
            if (typeof DeviceOrientationEvent.requestPermission === "function") {
                const permission = await DeviceOrientationEvent.requestPermission();

                if (permission !== "granted") {
                    alert("Permission to access the gyroscope was denied.");
                    return;
                }
            }

            // Listen for new gyroscope/orientation data
            window.addEventListener("deviceorientation", (event) => {

                // Read the three values provided by the sensor
                const alpha = event.alpha;
                const beta = event.beta;
                const gamma = event.gamma;

                // Display the sensor data on the webpage
                alphaElement.textContent = alpha.toFixed(2);
                betaElement.textContent = beta.toFixed(2);
                gammaElement.textContent = gamma.toFixed(2);
            });
        });
    </script>

</body>
</html>
